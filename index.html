<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>This Is My Heart, In A Different Form ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Canvases -->
  <canvas id="sky-canvas"></canvas>
  <canvas id="rose-garden-canvas"></canvas>
  <canvas id="fx-canvas"></canvas>

  <!-- Audio Element -->
  <audio id="bg-music" src="assets/music/perfect.mp3" preload="auto" loop></audio>

  <!-- Realistic Metallic Fountain Pen Nib -->
  <div id="pen-container" class="fountain-pen-cursor" style="display: none;">
    <svg class="pen-svg" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="goldBarrel" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fcf6ba"/>
          <stop offset="40%" stop-color="#bf953f"/>
          <stop offset="70%" stop-color="#b38728"/>
          <stop offset="100%" stop-color="#aa7c11"/>
        </linearGradient>
        <linearGradient id="silverNib" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="50%" stop-color="#cccccc"/>
          <stop offset="100%" stop-color="#888888"/>
        </linearGradient>
      </defs>
      <!-- Pen Body & Grip -->
      <path d="M 40 10 L 85 55 L 75 65 L 30 20 Z" fill="url(#goldBarrel)" stroke="#553c0e" stroke-width="0.8"/>
      <!-- Metallic Nib -->
      <path d="M 30 20 L 12 38 Q 8 42 5 50 Q 13 47 18 35 Z" fill="url(#silverNib)" stroke="#333333" stroke-width="0.5"/>
      <line x1="12" y1="38" x2="22" y2="28" stroke="#111111" stroke-width="0.8"/>
      <circle cx="17" cy="33" r="1" fill="#111111"/>
    </svg>
  </div>

  <!-- Main Viewport Area -->
  <main id="app"></main>

  <script src="script.js"></script>
</body>
</html>
